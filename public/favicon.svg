<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="petGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0c4a6e" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Background rounded squircle -->
  <rect width="64" height="64" rx="16" fill="url(#petGradient)" />
  
  <!-- Paw print pads -->
  <g fill="#ffffff" filter="url(#shadow)">
    <!-- Main pad -->
    <path d="M32 28 C26 28 21 34 22 41 C22.6 45.2 26.2 48 32 48 C37.8 48 41.4 45.2 42 41 C43 34 38 28 32 28 Z" />
    <!-- Toe 1 (left) -->
    <ellipse cx="20" cy="24" rx="4.5" ry="6.5" transform="rotate(-18 20 24)" />
    <!-- Toe 2 (center-left) -->
    <ellipse cx="28" cy="19" rx="4.5" ry="6.5" transform="rotate(-6 28 19)" />
    <!-- Toe 3 (center-right) -->
    <ellipse cx="36" cy="19" rx="4.5" ry="6.5" transform="rotate(6 36 19)" />
    <!-- Toe 4 (right) -->
    <ellipse cx="44" cy="24" rx="4.5" ry="6.5" transform="rotate(18 44 24)" />
  </g>
</svg>
