server {
    listen 80;
    listen [::]:80;
    
    # Reemplaza con tu dominio o IP pública del VPS
    server_name _;

    # Carpeta raíz pública de Laravel (OBLIGATORIO: siempre apuntar a /public)
    root /var/www/la-petdiatria/public;
    index index.php index.html;

    # Permitir subida de fotos de mascotas, recetas y adjuntos hasta 25MB
    client_max_body_size 25M;

    charset utf-8;

    # Encabezados de seguridad recomendados
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";

    # Redirección Front-Controller de Laravel
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Caché y optimización para assets estáticos generados por Vite (CSS, JS, Fuentes, Imágenes)
    location ~* \.(jpg|jpeg|png|gif|ico|webp|svg|css|js|woff|woff2|ttf|eot)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # Procesamiento de scripts PHP a través de PHP-FPM
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        
        # Socket Unix de PHP-FPM (para PHP 8.2)
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        
        # Timeouts para generación de reportes y PDFs
        fastcgi_read_timeout 180;
    }

    # Prohibir estrictamente el acceso a archivos ocultos y sensibles (.env, .git, etc.)
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Logs de acceso y errores específicos para este sitio
    access_log /var/log/nginx/la-petdiatria_access.log;
    error_log /var/log/nginx/la-petdiatria_error.log error;
}
