services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: petdiatria_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    networks:
      - petdiatria_net
    depends_on:
      db:
        condition: service_healthy

  web:
    image: nginx:alpine
    container_name: petdiatria_web
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
      - ./deploy/docker-nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - petdiatria_net
    depends_on:
      - app

  db:
    image: postgres:16-alpine
    container_name: petdiatria_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-veterinaria}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres_password_2026}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - petdiatria_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_DATABASE:-veterinaria}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    driver: local

networks:
  petdiatria_net:
    driver: bridge
